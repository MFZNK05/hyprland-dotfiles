# hypridle — idle management: lock, screen-off, suspend.
general {
    # flock -n = never two lockers. A retry loop was tried here and removed: hyprlock aborts
    #   with rc=134 and no output when an instance already exists, so the loop thrashed one
    #   doomed spawn per second. Bounded single retry instead, via the trailing fallback.
    # Fallback also covers a hung hyprlock holding the lock file, which would otherwise leave
    #   the screen open forever, silently.
    # Crash recovery leans on misc:allow_session_lock_restore = true (hyprland.conf) so a new
    #   locker can bind a session whose client died. Real cure is hyprlock newer than 0.9.2.
    lock_cmd = flock -n /tmp/hyprlock.lock -c hyprlock || pgrep -x hyprlock >/dev/null || hyprlock
    before_sleep_cmd = loginctl lock-session   # lock before sleeping
    after_sleep_cmd = hyprctl dispatch dpms on  # turn screen back on after wake
    ignore_dbus_inhibit = false
}

# Lock after 50 min idle
listener {
    timeout = 3000
    on-timeout = loginctl lock-session
}

# Screen off after 1 hr
listener {
    timeout = 3600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 1.5 hr
listener {
    timeout = 5400
    on-timeout = systemctl suspend
}
